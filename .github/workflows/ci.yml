name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, security, ai, frontend]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      if: matrix.service != 'frontend'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Setup Node.js
      if: matrix.service == 'frontend'
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies & run tests
      run: |
        if [ "${{ matrix.service }}" == "frontend" ]; then
          cd packages/frontend
          npm install
          chmod +x node_modules/.bin/vite || true
          npm run build
        elif [ "${{ matrix.service }}" == "security" ]; then
          # Run from packages/ so that "from security.xxx" imports work
          cd packages
          pip install -r security/requirements.txt
          pip install pytest
          PYTHONPATH=$(pwd) python -m pytest security/tests -v
        else
          cd packages/${{ matrix.service }}
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest
          PYTHONPATH=. python -m pytest
        fi
