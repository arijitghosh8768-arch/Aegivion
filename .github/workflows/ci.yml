name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, security, ai, frontend]
    
    env:
      SUPABASE_URL: "http://localhost:8000"
      SUPABASE_KEY: "dummy"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aegivion_test"

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegivion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      if: matrix.service != 'frontend'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Setup Node.js
      if: matrix.service == 'frontend'
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    - name: Install dependencies & run tests
      run: |
        if [ "${{ matrix.service }}" == "frontend" ]; then
          cd packages/frontend
          npm install
          chmod +x node_modules/.bin/vite || true
          npm run build
        elif [ "${{ matrix.service }}" == "security" ]; then
          pip install -r packages/security/requirements.txt
          pip install pytest
          PYTHONPATH=$(pwd)/packages python -m pytest packages/security/tests -v
        else
          cd packages/${{ matrix.service }}
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ "${{ matrix.service }}" == "backend" ]; then
            if [ -f ../security/requirements.txt ]; then
              pip install -r ../security/requirements.txt
            fi
            alembic upgrade head
          fi
          pip install pytest
          PYTHONPATH=".:.." python -m pytest
        fi

  security-scan:
    name: Security & Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 1. Dependency Vulnerability Scan with pip-audit
      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Scan Backend Dependencies (pip-audit)
        run: |
          pip-audit -r packages/backend/requirements.txt --desc

      - name: Scan Security Engine Dependencies (pip-audit)
        run: |
          if [ -f packages/security/requirements.txt ]; then
            pip-audit -r packages/security/requirements.txt --desc
          fi

      # 2. Static Application Security Testing (SAST) with Bandit
      - name: Run Bandit SAST on Backend
        run: |
          bandit -r packages/backend/app -ll -x "packages/backend/tests"

      # 3. Docker Container Scan with Trivy
      - name: Build Backend Docker Image
        run: |
          docker build -f packages/backend/Dockerfile -t aegivion-backend:ci .

      - name: Scan Backend Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aegivion-backend:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
