id: AWS-SG-001
version: 1
enabled: true
title: SSH Exposed to Internet
description: Security group allows unrestricted IPv4 or IPv6 access to SSH port
provider: aws
service: ec2
resource_type: security_group
severity: high

condition:
  field: configuration.exposed_services
  operator: network_exposure
  value: 
    port: 22

remediation:
  summary: Restrict SSH access to approved administrative networks
  steps:
    - Remove 0.0.0.0/0 and ::/0 from SSH ingress rules
    - Add specific CIDR ranges for authorized administrators
    - Consider using AWS Systems Manager Session Manager instead
  references:
    - "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/authorizing-access-to-an-instance.html"

mitre_techniques:
  - T1046
  - T1078

tags:
  - network
  - ssh
  - internet-exposure
