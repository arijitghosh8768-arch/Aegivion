id: AWS-SG-005
version: 1
enabled: true
title: All Traffic Allowed from Internet
description: Security group allows unrestricted all protocols access from internet
provider: aws
service: ec2
resource_type: security_group
severity: critical

condition:
  field: configuration.has_all_traffic
  operator: equals
  value: true

remediation:
  summary: Remove unrestricted all-traffic rules immediately
  steps:
    - Remove all -1/0.0.0.0/0 rules
    - Implement least-privilege security group rules
    - Define specific protocols and ports required
  references:
    - "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/authorizing-access-to-an-instance.html"

mitre_techniques:
  - T1078
  - T1190

tags:
  - network
  - all-traffic
  - critical
