id: AWS-S3-004
version: 1
enabled: true
title: S3 Bucket Versioning Disabled
description: S3 bucket does not have versioning enabled for data protection
provider: aws
service: s3
resource_type: s3_bucket
severity: medium

condition:
  field: configuration.versioning_enabled
  operator: equals
  value: false

remediation:
  summary: Enable bucket versioning
  steps:
    - Enable versioning on the bucket
    - Implement lifecycle rules for version management
    - Consider MFA delete for additional protection
  references:
    - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html"

mitre_techniques:
  - T1562

tags:
  - s3
  - versioning
  - data-protection
