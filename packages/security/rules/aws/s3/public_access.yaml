id: AWS-S3-001
version: 1
enabled: true
title: S3 Bucket Public Access Protection Disabled
provider: aws
resource_type: s3
severity: critical
description: S3 bucket does not have public access protection fully enabled.
conditions:
  - field: configuration.public_access_block.block_public_acls
    operator: equals
    value: false
  - field: configuration.public_access_block.block_public_policy
    operator: equals
    value: false
mitre_technique: T1530
mitre_tactic: exfiltration
remediation:
  - Enable S3 Block Public Access at the bucket level
  - Review existing bucket policies for public access
  - Apply bucket policies with explicit denies
