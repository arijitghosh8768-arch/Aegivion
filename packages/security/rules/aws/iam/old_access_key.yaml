id: AWS-IAM-002
version: 1
enabled: true
title: Active Access Key Exceeds 90 Days
description: IAM user has an active access key older than 90 days
provider: aws
service: iam
resource_type: iam_user
severity: medium

condition:
  field: configuration.oldest_active_key_days
  operator: greater_than
  value: 90

remediation:
  summary: Rotate access keys
  steps:
    - Create new access key
    - Update applications
    - Deactivate and delete old keys
  references:
    - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"

mitre_techniques:
  - T1098

tags:
  - iam
  - access-keys
  - credential-rotation
