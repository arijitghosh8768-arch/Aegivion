id: AWS-IAM-003
version: 1
enabled: true
title: Unused Access Key
description: IAM user has an active access key that has never been used
provider: aws
service: iam
resource_type: iam_user
severity: low

condition:
  field: configuration.has_unused_active_key
  operator: equals
  value: true

remediation:
  summary: Remove unused access keys
  steps:
    - Review whether the key is needed
    - Deactivate the key
    - Delete after confirmation
  references:
    - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"

mitre_techniques:
  - T1098

tags:
  - iam
  - access-keys
  - unused
