[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegivion-cloud-destruction"
version = "0.1.0"
description = "Aegivion Attack Algorithm #3: Cloud Destructive Activity Detector (Parts 1-5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["detection*", "ingestion*", "correlation*"]

[tool.pytest.ini_options]
testpaths = ["detection/cloud_destruction/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
